<!--
** 프로그램 설명
** 1. 비즈액터 Q 소스로 부터 MYBATIS XML 을 생성한다.
**    해당 소스코드 작성자로 로그인 General 탭 > ViewCode 클릭 > View Source Code 창의 java 소스코드 copy 후 본 화면의 원본에 paste
**    변환내역에 변환코드 생성됨
**    미지원내역
**    - 스칼라 값을 리턴하는 경우에도 hashMap 로 리턴함. 적절한 변경 필요
**    - 최초 WHERE 절 확인 필요.
** 2. SQL 내에 FUNCTION 사용시 (SELECT SF_XX FROM DUAL) 로 변환
**    미지원 내역
**    - FUNCTION 이 여러줄에 걸쳐 작성된 경우 ==> 확인사항 참조. 수작업으로 해야한다.
**    - GROUP BY 내에 함수가 사용된경우 오류가 발생할 수 있다. ==> 확인사항 참조(반드시 테스트 필요)
**    - 함수 파라미터로 MIN, MAX 가 사용된 경우 ==> 티베로 DUAL 적용시 티베로 오류가 발생하므로 제외
** 3. 실행테스트
**    미지원내역
**    - ${} 에 대한 처리 불가
**    - <if test 로 SELECT 문장이 분기처리된 경우 오류 발생
-->
<html>
    <head>
        <title>ALTIBASE(Q) -> TIBERO SQL Mapper Change</title>
        <meta http-equiv="Conent-Type" content="text/html"; charset="utf-8" />
        <script language="javascript">
            let chg_cnt = 0;  // function 변환 건수

            // mapper 변환
            function fn_mapper_change() {
                // 초기화
                document.getElementById("txt_cnt").value    = "";
                document.getElementById("txt_output").value = "";
                document.getElementById("txt_err").value    = "";
                document.getElementById("txt_test").value   = "";
                
                if (document.getElementById("txt_writer").value == "") {
                	
                	alert("작성자명을 꼭 기록하세요..\n생성시 작성자 주석에 포함됩니다.");	
                	document.getElementById("txt_writer").focus();
                	return;
                }

                // 전체 text
                var all_text = document.getElementById("txt_input").value;
                // 서비스ID
                var svc_id   = fn_find_svc_div("SERVICE ID");
                // 서비스NAME
                var svc_name = fn_find_svc_div("SERVICE NAME");
                // 서비스 DESC
                var svc_desc = fn_find_svc_text("SERVICE DESC START", "SERVICE DESC END", "-", true);
                // SQL 문장
                var sql_text = fn_find_svc_text("SQL START", "SQL END");
                // SQL 파라미터
                var sql_param_arr = fn_find_param_arr();

                //console.log("svc_id : " + svc_id);
                //console.log("svc_name : " + svc_name);
                //console.log("svc_desc : " + svc_desc);
                //console.log("sql_text : " + sql_text);
                //console.log("sql_param_arr : " + sql_param_arr);

                // MYBATIS XML 변환
                fn_app_mybatis_xml(svc_id, svc_name, svc_desc, sql_text, sql_param_arr);

                // FUNCTION SELECT..DUAL 변환
                fn_app_dual_function();
            }

            // 서비스 ID, 서비스 NAME  추출
            function fn_find_svc_div(svc_div) {
                var all_text  = document.getElementById("txt_input").value;
                var line_text = all_text.split("\n");
                var line_no   = line_text.findIndex(function(text){return text.includes(svc_div);});
                var regex     = new RegExp('('+svc_div+'|\\/|\\s|\\:)', 'g');

                return line_text[line_no].replace(regex, "").trim();
            }

            //  서비스 DESC, SQL 추출
            function fn_find_svc_text(start_text, end_text, not_inc, trim_yn) {
                var all_text  = document.getElementById("txt_input").value;
                var start_no  = all_text.indexOf(start_text) + start_text.length + 1;
                var end_no    = all_text.indexOf(end_text);
                var text_arr  = all_text.substring(start_no, end_no).split("\n");

                if (text_arr != null && text_arr.length > 1) {
                    text_arr.splice(-1);  // 마지막 요소 제거
                    text_arr.forEach(function(val, idx) {
                        text_arr[idx] = val.substring(3);   // 주석 + 공백 이후 시작
                        if (not_inc != null && not_inc != "") {
                            text_arr[idx] = text_arr[idx].replace(not_inc, "");
                        }
                        if (not_inc != null && trim_yn) {
                            text_arr[idx] = text_arr[idx].trim();
                        }
                    });
                }

                return text_arr.join("\n");
            }

            // SQL 파라미터 변수 추출
            function fn_find_param_arr() {
                var all_text  = document.getElementById("txt_input").value;
                var start_no  = all_text.lastIndexOf("new String[] {") +  "new String[] {".length + 1;
                var end_no    = all_text.indexOf("}", start_no);
                var param_arr = all_text.substring(start_no, end_no).split("\n");

                if (param_arr != null && param_arr.length > 0) {
                    param_arr.forEach(function(val, idx) {
                        param_arr[idx] = val.replace(/\t/g, "").replace(/\;/g, "^;");  //강제로 ; 앞에 ^ 삽입
                    });
                }

                return param_arr;
            }

            // MYBATIS XML 변환
            function fn_app_mybatis_xml(svc_id, svc_name, svc_desc, sql_text, sql_param_arr) {

                // sql 주석 문장 생성
                var desc_text = "", new_svc_id = svc_id;

                // sql id 생성
                var sql_div = "";
                if (sql_text.toUpperCase().trim().startsWith("SELECT")) {
                    sql_div = "select";
                    new_svc_id = svc_id.replace(/^(retrieve|check)/i, 'select');
                } else if (sql_text.toUpperCase().trim().startsWith("DELETE")) {
                    sql_div = "delete";
                } else if (sql_text.toUpperCase().trim().startsWith("INSERT")) {
                    sql_div = "insert";                    
                    new_svc_id = svc_id.replace(/^(create|save|regist)/i, 'insert');
                } else {
                    sql_div = "update";
                    new_svc_id = svc_id.replace(/^(create|save|regist|modify)/i, 'update');
                }
                new_svc_id = new_svc_id.substring(0, new_svc_id.length-3);                
                
                var xml_text = "";                
                var today    = new Date();
                var writer   = document.getElementById("txt_writer").value;
				xml_text += "<!--\n * Description : " + svc_name + "\n"; 
				xml_text += " * Create : "+today.getFullYear()+"."+(today.getMonth()+1).toString().padStart(2,'0')+"."+today.getDate().toString().padStart(2,'0') + " " + writer + " 최초생성\n-->\n"; 
				
                xml_text += "<" + sql_div + " id=\"" + new_svc_id + "\" parameterType=\"egovMap\"";
                if (sql_div == "select") {
                    xml_text +=  " resultType=\"egovMap\"";
                }
                xml_text +=  ">\n";
                xml_text +=  "/* AS-IS : " + svc_id +  " -> TO-BE : " + new_svc_id + " */\n";
                xml_text +=  "<![CDATA[\n";

                // altibase -> tibreo 변환함수 확인 필요
                var sql_arr = sql_text.split("\n");                
                sql_arr.forEach(function(val, idx) {
                    // @, $로 시작하는 파라미터 체크
                    var match_arr = val.match(/(@[\d\_a-zA-Z]+|\$\{[\d\_a-zA-Z]+\})/g);
                    
                    // -- 주석 /**/로 변경. 단 <!-- 처리는 변환하면 안됨)
                    if (val.indexOf("<!--") < 0 && val.indexOf("-->") && val.search(/\-\-/) >= 0) {                    	
                    	var chk_comm_txt = sql_arr.slice(0, idx-1).join("\n");                    	
                    	if (chk_comm_txt.lastIndexOf("/*") <= chk_comm_txt.lastIndexOf("*/"))  {
                    		val = val.replace(/\-\-/, "/* ").replace(/\s+$/, "") + " */";	
                    	}
                    }

                    // 파라미터 존재시
                    if (match_arr != null && match_arr.length > 0) {
                        console.log(val);
						
                        // @ 시작 파라미터 변경
                        match_arr.forEach(function(val_1, idx_1) {
                            if (val_1.startsWith("@")) {
                                val = val.replace(val_1, "#{" + val_1 + "}").replace("@", "");
                            }
                        });

                        var if_text = fn_change_param(match_arr, sql_param_arr, val);

                        sql_arr[idx] = "";                                                
                        if (if_text != null && if_text !="" && !xml_text.endsWith("</if>\n")) {                            
                            // 최초 WHERE가 있고, 이전 WHERE 가 없는 경우 (단, 스칼라 서브쿼리에 where가 있는 경우 처리불가)
                            if (if_text.search(/(WHERE)/i) >= 0) {
                            	var where_chk = false;
                            	for(var k=0;k<idx-1;k++) {
                            		if (sql_arr[k].search(/(WHERE)/i) >= 0) {
                            			where_chk = true;                            			
                            			break;
                            		}
                            	}                            	
                            	// 이전 문장에 WHERE 1=1 포함. 현재 문장에 WHERE 제거
                            	if (!where_chk) {
                            		sql_arr[idx] += " WHERE 1=1\n]]>\n";
                            		if_text = if_text.replace(/(WHERE)/i, "AND"); 
                            	} else {
                            		sql_arr[idx] += "]]>\n";
                            	}
                            } else {
                            	sql_arr[idx] += "]]>\n";
                            }                            
                        } else if (if_text == "" && xml_text.endsWith("</if>\n")) {  //if test 사이에 필수 마라미터만 있는 문장
                        	sql_arr[idx] += "<![CDATA[\n";
                        }	

                        if (if_text != null && if_text !="") {
                            sql_arr[idx] += if_text;
                        } else {
                            sql_arr[idx] += val+"\n";
                        }
                    } else {
                        sql_arr[idx] =  "";
                        if (val.trim() != "") {
                            if (xml_text.endsWith("</if>\n")) {
                                sql_arr[idx] += "<![CDATA[\n";
                            }
                            sql_arr[idx] += val+"\n";
                        }
                    }
                    xml_text += sql_arr[idx];
                });

                if (xml_text.endsWith("<![CDATA[\n")) {
                    xml_text = xml_text.substring(xml_text.lastIndexOf("<![CDATA[\n"), xml_text.length);
                } else {
                    if (!xml_text.endsWith("</if>\n")) {
                        xml_text +=  "]]>\n";
                    }
                }

                xml_text +=  "</" + sql_div + ">";
                document.getElementById("txt_output").value = xml_text;
            }

            // 파라미터 적용
            function fn_change_param(match_arr, sql_param_arr, val) {               
                
                // forEach break 가 안되므로 for문으로 적용
                var apply_param_arr = [];
                for(var i=0;i<match_arr.length;i++) {
                    var match_text = match_arr[i].replace(/[\@\$\{\}]/g, "");

                    for(var j=0;j<sql_param_arr.length;j++) {
                        // 두개가 일치(또는 ;로시작)하면 가변, 한개만 일치하면 고정
                        var regex = new RegExp('([\\,|\\"|\\;]{1}'+match_text+'[\\,|\\"|\\^]{1})', 'g');

                        if (sql_param_arr[j].search(regex) >= 0) {
                            var regex_1 = new RegExp('([\\;]{1}'+match_text+'[\\,|\\"]{1})', 'g');
                            // ;시작시 가변
                            if (sql_param_arr[j].search(regex_1) >= 0) {
                                apply_param_arr.push(match_text);
                                // 배열요소에서 삭제
                            	sql_param_arr[j] = sql_param_arr[j].replaceAll(match_text, "");
                            } else {                            	
                            	// ;와 같은 라인의 가변요소
                            	if (sql_param_arr[j].match(regex).length > 1 && sql_param_arr[j].indexOf("^;")  >= 0) {
                            		apply_param_arr.push(match_text);
                            		sql_param_arr[j] = sql_param_arr[j].replaceAll(match_text, "");
                            	} else {
                            		// 배열요소에서 삭제
                            		sql_param_arr[j] = sql_param_arr[j].replace(match_text, "");	
                            	}
                        	}
                            break;
                        }
                    }
                }                

                var if_text = "";
                if (apply_param_arr.length > 0) {
                    var if_text = "<if test=\'";

                    for(var i=0;i<apply_param_arr.length;i++) {
                        if (i>0) {
                            if_text += " and ";
                        }
                        if_text += apply_param_arr[i] + " != null and " + apply_param_arr[i] + " != \"\""
                    }

                    if_text += "\'>\n";
                    // xml 파싱오류 문자 cdata 처리
                    if (val.indexOf(">") >= 0 || val.indexOf("<") >= 0) {
                        if_text += "<![CDATA[\n";
                    }
                    if_text += val + "\n";

                    // xml 파싱오류 문자 cdata 처리
                    if (val.indexOf(">") >= 0 || val.indexOf("<") >= 0) {
                        if_text += "]]>\n";
                    }
                    if_text += "</if>\n";
                }

                return if_text;
            }

            // function dual 적용
            function fn_app_dual_function() {
                chg_cnt = 0;  // function 변환 건수
                var all_text     = document.getElementById("txt_output").value;  //1차 변환된 mybatis
                var line_arr     = all_text.split("\n");
                var new_text     = "";
                var replace_text = "";

                line_arr.forEach(function(line_text, line_no){
                    console.log(line_text);
                    replace_text = fn_replace_dual(line_text, line_no);
                    new_text += replace_text + (line_no == (line_arr.length-1)?"":"\n");
                });

                // function 적용 반영
                document.getElementById("txt_output").value = new_text;
                document.getElementById("txt_cnt").value    = chg_cnt;
                document.getElementById("txt_output").focus();
                document.getElementById("txt_output").select();

                // test 적용
                var test_text = new_text;
                var test_arr  = test_text.split("\n");
                var start_no = test_arr.findIndex(function(text) { return text.includes("<![CDATA[");} );  // 첫번째 CDATA
                test_text = test_arr.slice(start_no+1, test_arr.length-1).join("\n");
                test_text = test_text.replace(/(<\!\[CDATA\[|\]\]\>|\<if.+\>|\<\/if\>)/gi, "");
                test_text = test_text.replace(/[\#]{1}[\{]{1}[\w\_0-9]+[\}]{1}/gi, "'1'");

                document.getElementById("txt_test").value   = test_text;
            }

            // 라인 문자열 dual 적용
            function fn_replace_dual(line_text, line_no) {
                var fn_select_arr  = line_text.match(/[\da-zA-Z\_\.]*(F_|SF_){1}[\w]{1,}[\\st]{0,}[\(]{1,1}/gi); // function 매치 조회. 사용자 있는 경우 포함
                var dual_list_arr  = line_text.match(/FROM[\(\s]{1,}DUAL/gi);   // DUAL 사용 ARR
                var group_list_arr = line_text.match(/GROUP[\t\s]+BY/gi);       // GROUP BY 사용 ARR

                if (fn_select_arr == null) {
                    return line_text;
                }

                if (dual_list_arr != null)  {
                    document.getElementById("txt_err").value  += "------------------" + (line_no + 1)  + "라인(이미적용)" + line_text + "\n";
                    return line_text;
                }

                if (group_list_arr != null)  {
                    document.getElementById("txt_err").value  += "------------------" + (line_no + 1)  + "라인(GROUP BY 절 사용여부 확인)" + line_text + "\n";
                    return line_text;
                }

                var replace_text = line_text;
                var idx_list_arr = [], relace_arr = [];
                var chk_idx = 0;

                fn_select_arr.forEach(function(fn_str, idx) {
                    console.log("일치하는 문자열 존재 " + idx + " : " + fn_str);

                    idx_list_arr[idx] = line_text.indexOf(fn_str, chk_idx) + fn_str.length-1;
                    chk_idx = idx_list_arr[idx] + 1;

                    var rev_text = fn_get_text(line_text.substring(idx_list_arr[idx], line_text.length));

                    if (rev_text != "") {
                        if (rev_text.search(/(MIN\(|MIN[\t]{1,}\(|MIN[\s]{1,}\(|MAX\(|MAX[\t]{1,}\(|MAX[\s]{1,}\()/gi) >= 0) {
                            if (rev_text.search(/(MIN)/gi) >= 0) {
                                document.getElementById("txt_err").value  += "------------------" + (line_no + 1)  + "라인(GROUP BY 함수포함  MIN)" + line_text + "\n";
                            } else {
                                document.getElementById("txt_err").value  += "------------------" + (line_no + 1)  + "라인(GROUP BY 함수포함  MAX)" + line_text + "\n";
                            }
                        } else {
                            var fn_st2 = fn_str.substring(0, fn_str.length-1);
                            relace_arr[idx] = fn_st2 + rev_text;

                            if (!fn_dup_chk(relace_arr)) {
                                //console.log("최종문자열 : " + idx + " : " + relace_arr[idx]);
                                replace_text = replace_text.replaceAll(relace_arr[idx], "(SELECT " + relace_arr[idx] + " FROM DUAL)");
                                chg_cnt++;
                            }
                        }
                    } else {
                        // 괄호불일치
                        document.getElementById("txt_err").value  += "------------------" + (line_no + 1)  + "라인(괄호불일치)" + line_text + "\n";
                    }
                });

                return replace_text;
            }

            // 문자열 추출
            function fn_get_text(txt) {
                var chk_cnt = 0;
                var rev = "";
                var started = false;

                for(var i=0;i<txt.length;i++) {
                    if (txt.substring(i, i+1)  == "(") {
                        chk_cnt++;
                        started = true;
                    }
                    if (txt.substring(i, i+1)  == ")") {
                        chk_cnt--;
                    }
                    if (chk_cnt== 0 && started) {
                        rev = txt.substring(0, i+1);
                        break;
                    }
                }
                return rev;
            }

            // function 중복적용 체크
            function fn_dup_chk(relace_arr) {
                var dup_chk = false;
                if (relace_arr.length > 1) {
                    var last_text = relace_arr[relace_arr.length-1];
                    var new_arr   = relace_arr.slice(0, relace_arr.length-1);

                    if (new_arr.includes(last_text)) {
                        dup_chk = true;
                    }
                }
                return dup_chk;
            }

            // input 포커스
            function fn_input_focus() {
                document.getElementById("txt_cnt").value    = "";
                document.getElementById("txt_input").value  = "";
                document.getElementById("txt_output").value = "";
                document.getElementById("txt_err").value    = "";
                document.getElementById("txt_test").value   = "";
            }

            // key 다운
            function fn_key_down() {
                if (event.keyCode == 113) {
                    fn_mapper_change();
                }
            }
        </script>
    </head>
    <body onkeydown="javascript:fn_key_down();">
        <h1>SQL Mapper 전환</h1>
            <form action="action" id="f_change" name="f_change">
                <b>원본</b> <b style="padding-left: 814px;">작성자</b><input type="text" id="txt_writer" name="txt_writer" style="width:100px;height:18px;" maxlength="10"><br/>
                <textarea id="txt_input" name="txt_input" rows="8" style="width:1000px;height:200px;" onfocus="javascript:fn_input_focus();"></textarea>
                <br/>
                <b>변환</b><br/>
                <textarea id="txt_output" name="txt_output" rows="8" style="width:1000px;height:200px;"></textarea>
                <br/><b>확인사항(미변환내역/수작업필요)</b>
                <b style="padding-left: 536px;">FUNCTION 변환건수 : </b><input type="text" id="txt_cnt" name="txt_cnt" readonly style="text-align:right;width:48px;height:18px;"><br/>
                <textarea id="txt_err" name="txt_err" rows="3" style="width:1000px;height:80px;"></textarea><br/>
                <b>실행테스트</b><br/>
                <textarea id="txt_test" name="txt_test" rows="3" style="width:1000px;height:200px;"></textarea><br/>
            </form>            
            <input type="button" name="btn" id="btn" value="변환(F2)" onclick="javascript:fn_mapper_change();"/>
    </body>
</html>
