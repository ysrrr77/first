            fn_find_control = function(xml_doc, tagName, id) {

                for(component of components) {

            // 데이터셋 스트링 생성
            var fn_make_datastring = function(dataset, type, record_chk) {

                if (dataset.tagName == "Contents") {

                    if (type == "map") {
                        data_string += "                    <w2:keyInfo>\n";
                    } else {
                        data_string += "                    <w2:columnInfo>\n";
                    }

                    for(col of dataset.children) {
                        fn_make_datastring(col, type, record_chk);
                    }

                    if (!record_chk) {
                        if (type == "map") {
                            data_string += "                    </w2:keyInfo>\n";
                        } else {
                            data_string += "                    </w2:columnInfo>\n";
                        }
                    }
                }

                if (dataset.tagName == "colinfo") {
                    var tagId = dataset.getAttribute("id");
                    if (type == "map") {
                        data_string += "                        <w2:key id=\"" + tagId + "\" name=\"" + tagId + "\" dataType=\"text\"></w2:key>\n";
                    } else {
                        data_string += "                        <w2:column id=\"" + tagId + "\" name=\"" + tagId + "\" dataType=\"text\"></w2:column>\n";
                    }
                }

                // asis 는 record 가 여러건이다. -> 시작과 끝만 data 를 붙여야 한다. 반복은 row로
                if (dataset.tagName == "record") {
                    data_string += "                        <w2:row>\n";

                    for(record of dataset.children) {
                        fn_make_datastring(record, type, record_chk);
                    }

                    data_string += "                        </w2:row>\n";
                }

                if (dataset.parentNode.tagName == "record") {
                    var tagName  = dataset.tagName;
                    var tagValue = dataset.textContent;
                    data_string += "                            <" + tagName +"><![CDATA[" + tagValue + "]]></"+ tagName +">\n";
                }
            }

            // var 선언 전역변수
            fn_replace_var_tobe = function() {

                var tobe_text = document.getElementById("txt_new").value;
                var tobe_arr  = tobe_text.split("\n");

                var script_start = tobe_arr.findIndex(function(text){return text.includes("<script lazy=\"false\" type=\"text\/javascript\"\>");});
                var script_end   = tobe_arr.findIndex(function(text){return text.includes("\]\]><\/script>");});

                var script_arr   = tobe_arr.slice(script_start+1, script_end);
                var script_text  = script_arr.join("\n");

                // funtion 만나기 전까지만 scwin 으로 처리
                // var replace 처리
                // 전역변수 처리. = 나 ; 만나기 전까지
                for(var i=0;i<script_arr.length; i++) {

                    if (script_arr[i].indexOf("function") >= 0)  {
                        break;
                    }

                    if (script_arr[i].search(/\bvar\b/ig) >= 0) {
                        var match_arr = script_arr[i].match(/\bvar\b/ig);

                        var idx = 0;
                        for(var j=0;j<match_arr.length;j++) {
                            // 온전한 단어 추출  ( = 나 ;전까지 추출후 trim 처리한다.)
                            var line_text = script_arr[i].substring(idx);

                            idx = line_text.search(/[\;]/g)+1;
                            var word = line_text.substring(line_text.search(/\bvar\b/ig)+3, line_text.search(/[\;\=]/g));
                            word = word.trim().replace("\t", "");  // 온전한 단어


                            var regex_line = new RegExp('var[\\s\\t]\\b'+word+'\\b', 'g');
                            var regex_word = new RegExp('\\b'+word+'\\b', 'g');

                            // 단어 변경
                            script_text = script_text.replace(regex_line, word);

                            // 단어 변경
                            script_text = script_text.replace(regex_word, "scwin."+word);
                        }
                    }
                }

                tobe_arr.splice(script_start+1, script_end-(script_start)-1, script_text);
                document.getElementById("txt_new").value = tobe_arr.join("\n");
            }

            // com. 붙이면 되는 공통함수 (gfn으로 시작하는 단어는 com 을 붙인다.)
            fn_replace_com_tobe = function() {

                var tobe_text = document.getElementById("txt_new").value;
                var tobe_arr  = tobe_text.split("\n");

                var script_start = tobe_arr.findIndex(function(text){return text.includes("<script lazy=\"false\" type=\"text\/javascript\"\>");});
                var script_end   = tobe_arr.findIndex(function(text){return text.includes("\]\]><\/script>");});

                var script_arr   = tobe_arr.slice(script_start+1, script_end);
                var script_text  = script_arr.join("\n");

                for(var i=0;i<script_arr.length; i++) {
                	// 정규식 수정 필요
                    var gfn_match_arr  = script_arr[i].match(/(^com.)*(gfn_){1}[\w]{1,}[\\st]{0,}/gi); // function 매치 조회. 사용자 있는 경우 포함
                    //var gfn_match_arr  = script_arr[i].match(/([^.]gfn_){1}[\w]{1,}[\\st]{0,}/gi); // function 매치 조회. 사용자 있는 경우 포함

                    if (gfn_match_arr != null && gfn_match_arr.length > 0)  {

                        var n_match_arr = gfn_match_arr.filter((ele, iidx) => {
                            return gfn_match_arr.indexOf(ele) === iidx;
                        });

                        for(var j=0;j<n_match_arr.length; j++) {
                            var regex_word = new RegExp('\\b'+n_match_arr[j].trim()+'\\b', 'g');
							if (n_match_arr[j].trim().toLowerCase() == "gfn_isnull") n_match_arr[j] =  "gfn_IsNull";
							//if (n_match_arr[j].trim().toLowerCase() == "gfn_alert") n_match_arr[j]  =  "alert";
							//if (n_match_arr[j].trim().toLowerCase() == "gfn_msgalert") n_match_arr[j] = "message";
							
							
                            script_arr[i] = script_arr[i].replace(regex_word, 'com.' + n_match_arr[j].trim());
                        }
                    }
                    
                    // ==================================================================================================
                    // 마이플랫폼 내장함수 com 으로 변경(좀더 조사 필요)
                    // ==================================================================================================
			        var com_match_arr  = script_arr[i].match(/[^.]\bsubstr\b|[^.]\btrim\b|[^.]\blength\b|[^.]\btoNumber\b|[^.]\bParseFloat\b|[^.]\baddDate\b|[^.]\bToInteger\b|[^.]\bReplace\b|[^.]\bIndexOf\b|[^.]\bsplit\b|[^.]\baddMonth\b/gi);  
                    
                    if (com_match_arr != null && com_match_arr.length > 0)  {
                    	
                    	// 중복제거
                    	var n_match_arr = com_match_arr.filter((ele, iidx) => {
                            return com_match_arr.indexOf(ele) === iidx;
                        });
                    	
                    	for(var j=0; j<n_match_arr.length;j++) {                    		
                    		if (n_match_arr[j].search(/[^.]\bParseFloat\b/gi) >= 0) {
                    			script_arr[i] = script_arr[i].replace(n_match_arr[j], n_match_arr[j].substring(0, 1) + 'parseFloat');
                    		} else if (n_match_arr[j].search(/[^.]\bToInteger\b/gi) >= 0) {
                    			script_arr[i] = script_arr[i].replace(n_match_arr[j], n_match_arr[j].substring(0, 1) + 'parseInt');
                    		} else if (n_match_arr[j].search(/[^.]\bIndexOf\b/gi) >= 0) {
                    			script_arr[i] = script_arr[i].replace(n_match_arr[j], n_match_arr[j].substring(0, 1) + 'com.indexOf');	
                    		} else if (n_match_arr[j].search(/[^.]\bReplace\b/gi) >= 0) {
                    			script_arr[i] = script_arr[i].replace(n_match_arr[j], n_match_arr[j].substring(0, 1) + 'com.' + n_match_arr[j].substring(1, n_match_arr[j].length).toLowerCase());	
                    		} else {                    		
                    			script_arr[i] = script_arr[i].replace(n_match_arr[j], n_match_arr[j].substring(0, 1) + 'com.' + n_match_arr[j].substring(1, n_match_arr[j].length));
                    		}	
                    	}                    	
                    }
                    
                    var com_match_arr  = script_arr[i].match(/\barray\b/gi); 
                    if (com_match_arr != null && com_match_arr.length > 0)  {
                    	script_arr[i] = script_arr[i].replace(/\barray\b/gi, "Array");
                    }	 
                    
                }

                tobe_arr.splice(script_start+1, script_end-(script_start)-1, script_arr.join("\n"));
                document.getElementById("txt_new").value = tobe_arr.join("\n");
            }

            // functon style 변경
            fn_replace_function_tobe = function() {

                var tobe_text = document.getElementById("txt_new").value;
                var tobe_arr  = tobe_text.split("\n");

                var script_start = tobe_arr.findIndex(function(text){return text.includes("<script lazy=\"false\" type=\"text\/javascript\"\>");});
                var script_end   = tobe_arr.findIndex(function(text){return text.includes("\]\]><\/script>");});

                var script_arr   = tobe_arr.slice(script_start+1, script_end);
                var script_text  = script_arr.join("\n");

                for(var i=0;i<script_arr.length; i++) {

                    // 수정해야 한다. 호출하는 곳이 안먹는다.
                    if (script_arr[i].search(/[^.]*(function){1}/) >= 0)  {

                        var chk_comm_txt = script_arr.slice(0, i).join("\n");

                        // 여러줄 주석안에 있는 함수는 제외
                        if (chk_comm_txt.lastIndexOf("/*") > chk_comm_txt.lastIndexOf("*/"))  {
                            continue;
                        }

                        // 한줄 주석이 function 앞에 있으면 pass
                        if (script_arr[i].search(/\/\//) >= 0  && (script_arr[i].search(/\/\//) < script_arr[i].indexOf("function"))){
                            continue;
                        }

                        // 여러줄 주석이 시작이 function 앞에 있으면 pass
                        if (script_arr[i].search(/\/\*/) >= 0 && (script_arr[i].search(/\/\*/) < script_arr[i].indexOf("function"))){
                            continue;
                        }

                        // 이미 변경된건 pass
                        if (script_arr[i].indexOf("scwin.") >= 0){
                            continue;
                        }

                        var match_text   = script_arr[i].substring(script_arr[i].indexOf('function')+'function'.length, script_arr[i].indexOf("(")).trim().replaceAll('\t', '');
                        if (match_text != null && match_text != "") {
                            var replace_text = 'scwin.' + match_text  + ' = function' + script_arr[i].substring(script_arr[i].indexOf("("));
                            script_arr[i] = script_arr[i].replace(script_arr[i], replace_text);

                            for(var j=0;j<script_arr.length; j++) {
                                if (i != j && script_arr[j].search(/function/) < 0)  {
                                    // 가끔 대소문자 틀린게 존재
                                    
                                    try {
										var regex_word     = new RegExp('(\\b'+match_text+'\\b)', 'gi');
	                                    var regex_word_not = new RegExp('('+'scwin.'+match_text+')', 'gi');
	
	                                    if (script_arr[j].search(regex_word) >=  0  && script_arr[j].search(regex_word_not) < 0) {
	                                        script_arr[j] = script_arr[j].replace(regex_word, 'scwin.' + match_text);
	                                    }
										
									} catch(err) {
										console.log("script_arr[j] : " + script_arr[j]);
										console.log("replace_text : " + replace_text);
									}
                                    
                                    
                                }
                            }
                        }
                    }
                    
                    /*
                    --데이터 셋과 겹친다.
                    if (script_arr[i].search(/[\w\d]+(_OnLoadCompleted)/gi) > 0) {
                    	script_arr[i] = script_arr[i].replace(/[\w\d]+(_OnLoadCompleted)/gi, "onpageload");
                    }
                    
                    if (script_arr[i].search(/[\w\d]+(_OnUnloadCompleted)/gi) > 0) {
                    	script_arr[i] = script_arr[i].replace(/[\w\d]+(_OnUnloadCompleted)/gi, "onpageunload");
                    } 
                    */
                }

                //tobe_arr.splice(script_start+1, script_end-(script_start)-1, script_text);
                tobe_arr.splice(script_start+1, script_end-(script_start)-1, script_arr.join("\n"));

                // 바뀐 이벤트 변경
                var tobe_text = document.getElementById("txt_new").value;

                                if (dataset_arr[i].type == dataset_script_arr[j].type) {

                                        // 콤마가 정규식 그룹에 안묶여 예외처리(정확한 단어에서 제외됨
                                        regex_function = new RegExp('(\\b'+dataset_arr[i].asis +'.'+ dataset_script_arr[j].asis +'\\b)[\\s\\t]*[\\,]+[\\s\\t]*', 'gi');
                                    } else {
                                        regex_function = new RegExp('(\\b'+dataset_arr[i].asis +'.'+ dataset_script_arr[j].asis +'\\b)', 'gi');
                                    }

            }

                                                    }

	                                            if (script_arr[j].search(regex_function3) >= 0) {
	                                                var match_arr = script_arr[j].match(regex_function3);
	                                                if (match_arr != null && match_arr.length > 0) {
	                                                    for(var k=0; k<match_arr.length; k++) {
	                                                        var control_val  = match_arr[k].substring(match_arr[k].indexOf("=")+1, match_arr[k].length-1).trim();
	                                                        var control_text = match_arr[k].substring(0, match_arr[k].indexOf("."));
	                                                        
	                                                        if (common_control_script_arr[i].asis == "value" || common_control_script_arr[i].asis == "text") {

                                            }

                                                        }
